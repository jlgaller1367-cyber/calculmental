<style>
  :root {
    color-scheme: dark;
    --bg-a: #163e73;
    --bg-b: #071a33;
    --bg-c: #050f21;
    --paper: #0f2b52;
    --paper-alt: #123568;
    --paper-line: #1f4d8c;
    --ink: #F4F7FC;
    --ink-soft: #9FB6DE;
    --accent: #F2B134;
    --accent-ink: #3A2508;
    --good: #4ECDA0;
    --bad: #F0685B;
    --good-bg: #123f34;
    --bad-bg: #40201c;
    --shadow: rgba(2, 8, 20, 0.55);
    --dot-empty: #23477c;
    --key-bg: #163a6c;
    --cat: #E8935B;
    --cat-dark: #C97645;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle at 50% -10%, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    *:not(.slime-overlay):not(.slime-wash):not(.slime-drip):not(.confetti-piece):not(.pop-toast):not(.firework-particle) {
      transition: none !important;
      animation: none !important;
    }
  }

  .sheet {
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border-radius: 16px;
    box-shadow: 0 18px 40px var(--shadow);
    background-image:
      repeating-linear-gradient(45deg, transparent, transparent 16px, color-mix(in srgb, var(--paper-alt) 55%, transparent) 17px, color-mix(in srgb, var(--paper-alt) 55%, transparent) 18px),
      radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--accent) 10%, transparent) 0, transparent 42%);
    padding: 30px 26px 30px;
    position: relative;
    overflow: hidden;
  }

  .sheet::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent), #ffe6a3, var(--accent));
  }

  header.sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .tagline {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }

  .head-right {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .lang-switch {
    display: flex;
    gap: 3px;
  }

  .lang-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 3px 6px;
    cursor: pointer;
  }

  .lang-btn:hover { color: var(--ink); }

  .lang-btn[aria-pressed="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }

  .auth-box {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 24px;
  }

  .auth-box[hidden] { display: none; }

  .auth-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--paper-line);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }

  .auth-btn:hover { color: var(--ink); }

  .auth-btn.go {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
  }

  .grade-box {
    flex: none;
    width: 58px;
    height: 58px;
    border: 2.5px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 14px;
    color: var(--accent);
    transform: rotate(-6deg);
    font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }

  .level-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .expert-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
    font-family: 'Public Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .tab {
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--ink-soft);
    background: transparent;
    border: 1.5px solid var(--paper-line);
    border-radius: 8px 8px 3px 3px;
    padding: 8px 11px 7px;
    cursor: pointer;
  }

  .tab:hover { color: var(--ink); }

  .tab[aria-pressed="true"] {
    background: color-mix(in srgb, var(--accent) 14%, var(--paper));
    color: var(--ink);
    border-color: var(--accent);
    box-shadow: 0 2px 0 var(--accent);
    transform: translateY(-2px);
  }

  .tab:focus-visible, button:focus-visible {
    outline: 2.5px solid var(--accent);
    outline-offset: 2px;
  }

  .dots {
    display: flex;
    gap: 7px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--dot-empty);
    flex: none;
  }

  .dot.current {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
  }

  .dot.good { background: var(--good); }
  .dot.bad { background: var(--bad); }

  .equation {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    font-weight: 600;
    font-size: 44px;
    font-variant-numeric: tabular-nums;
    margin: 4px 0 20px;
  }

  .equation .eq { color: var(--ink-soft); font-size: 32px; }

  #answerDisplay {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 76px;
    height: 56px;
    padding: 0 10px;
    border-bottom: 3px solid var(--accent);
    color: var(--ink);
  }

  #answerDisplay.placeholder { color: var(--dot-empty); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 260px;
    margin: 0 0 18px;
  }

  .key {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    background: var(--key-bg);
    border: 1.5px solid var(--paper-line);
    border-radius: 10px;
    height: 56px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }

  .key:active { transform: translateY(1px); }
  .key:disabled { opacity: 0.45; cursor: default; }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  button.primary {
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent-ink);
    background: var(--accent);
    border: none;
    border-radius: 9px;
    padding: 13px 26px;
    cursor: pointer;
    box-shadow: 0 2px 0 color-mix(in srgb, var(--accent-ink) 35%, transparent);
  }

  button.primary:active { transform: translateY(1px); box-shadow: none; }
  button.primary:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: none; }

  button.ghost {
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    background: transparent;
    border: 1.5px solid var(--paper-line);
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
  }

  .feedback {
    min-height: 26px;
    margin-top: 14px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
  }

  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .stats {
    display: flex;
    gap: 20px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--paper-line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }

  .stats b { color: var(--ink); font-weight: 600; }

  .music-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
  }

  .music-toggle input[type="range"] {
    width: 66px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .switch {
    position: relative;
    width: 34px;
    height: 18px;
    flex: none;
    padding: 0;
    border: 1px solid var(--paper-line);
    border-radius: 999px;
    background: var(--key-bg);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease;
  }

  .switch .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--ink-soft);
    transition: transform 0.18s ease, background 0.18s ease;
  }

  .switch[aria-checked="true"] {
    background: var(--accent);
    border-color: var(--accent);
  }

  .switch[aria-checked="true"] .knob {
    transform: translateX(16px);
    background: var(--accent-ink);
  }

  .reset-btn {
    font-family: 'Public Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-bottom: 1px dotted var(--paper-line);
    padding: 0 0 1px;
    cursor: pointer;
  }

  .reset-btn:hover { color: var(--bad); border-bottom-color: var(--bad); }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(3, 10, 22, 0.68);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10000;
  }

  .modal {
    width: 100%;
    max-width: 340px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    box-shadow: 0 22px 50px rgba(2, 8, 20, 0.6);
  }

  .modal h2 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .modal p {
    font-size: 13.5px;
    line-height: 1.45;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  button.danger {
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #2c0b06;
    background: var(--bad);
    border: none;
    border-radius: 9px;
    padding: 11px 18px;
    cursor: pointer;
  }

  .results { text-align: left; }

  .results .grade {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 60px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 122px;
    height: 122px;
    border: 3.5px solid var(--good);
    color: var(--good);
    border-radius: 50%;
    transform: rotate(-4deg);
    margin-bottom: 16px;
    background: color-mix(in srgb, var(--good) 10%, transparent);
  }

  .results.low .grade {
    border-color: var(--bad);
    color: var(--bad);
    background: color-mix(in srgb, var(--bad) 10%, transparent);
  }

  .results p {
    font-size: 15.5px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .results p b { color: var(--ink); }

  @keyframes popBounce {
    0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
    55% { transform: scale(1.18) rotate(3deg); opacity: 1; }
    75% { transform: scale(0.94) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .pop-toast {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
  }

  .pop-toast .word {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 700;
    font-size: 54px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-shadow: 0 8px 20px rgba(2, 8, 20, 0.55);
  }

  .pop-toast.show {
    opacity: 1;
    animation: popBounce 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .pop-toast.good .word { color: var(--good); }
  .pop-toast.bad .word { color: var(--bad); }

  @keyframes confettiFall {
    0% { transform: translateY(-12px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(320px) rotate(540deg); opacity: 0; }
  }

  .confetti-piece {
    position: absolute;
    top: 0;
    width: 7px;
    height: 12px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 7;
    animation-name: confettiFall;
    animation-timing-function: ease-in;
    animation-fill-mode: forwards;
  }

  @keyframes slimeDrip {
    0% { transform: scaleY(0); opacity: 0; }
    15% { transform: scaleY(1); opacity: 1; }
    78% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(0.1); opacity: 0; }
  }

  @keyframes slimeWash {
    0% { opacity: 0; }
    14% { opacity: 1; }
    72% { opacity: 1; }
    100% { opacity: 0; }
  }

  .slime-overlay {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 9999;
  }

  .slime-wash {
    position: absolute;
    inset: 0;
    background: rgba(139, 195, 74, 0.24);
    opacity: 0;
    animation: slimeWash 2.3s ease-in-out forwards;
  }

  .slime-drip {
    position: absolute;
    top: -20px;
    border-radius: 45% 45% 50% 50% / 65% 65% 35% 35%;
    transform-origin: top center;
    box-shadow: inset 0 -8px 14px rgba(0, 0, 0, 0.2);
    animation-name: slimeDrip;
    animation-duration: 2.2s;
    animation-timing-function: ease-in-out;
    animation-fill-mode: forwards;
  }

  @keyframes fireworkFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
  }

  .firework-overlay {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 9998;
  }

  .firework-particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: fireworkFly 1.1s ease-out forwards;
  }

  .cat-pop {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    pointer-events: none;
    z-index: 5;
  }

  .cat-bubble {
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    color: var(--accent-ink);
    background: var(--accent);
    padding: 4px 9px;
    border-radius: 999px;
  }

  .subject-switch {
    display: flex;
    gap: 6px;
    margin: 0 0 18px;
  }

  .subject-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: 'Public Sans', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--paper-alt) 60%, transparent);
    border: 1.5px solid var(--paper-line);
    border-radius: 999px;
    padding: 9px 14px;
    cursor: pointer;
  }

  .subject-btn:hover { color: var(--ink); }

  .subject-btn .ico { font-size: 16px; }

  .subject-btn[aria-pressed="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 2px 0 color-mix(in srgb, var(--accent-ink) 30%, transparent);
  }

  .prompt {
    font-family: 'Public Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .picture {
    font-size: 66px;
    line-height: 1.15;
    text-align: center;
    margin: 2px 0 18px;
    filter: drop-shadow(0 6px 12px rgba(2, 8, 20, 0.5));
  }

  .story {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 16.5px;
    line-height: 1.55;
    color: var(--ink);
    background: color-mix(in srgb, var(--paper-alt) 70%, transparent);
    border-left: 3px solid var(--accent);
    border-radius: 4px 10px 10px 4px;
    padding: 12px 14px;
    margin: 0 0 16px;
  }

  .question {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.4;
    color: var(--ink);
    margin: 0 0 16px;
    text-wrap: balance;
  }

  .question .gap {
    display: inline-block;
    min-width: 64px;
    border-bottom: 3px solid var(--accent);
    vertical-align: -3px;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 0 0 18px;
  }

  .choices.stack { grid-template-columns: 1fr; }

  .choice {
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink);
    background: var(--key-bg);
    border: 1.5px solid var(--paper-line);
    border-radius: 10px;
    padding: 12px 13px;
    min-height: 52px;
    cursor: pointer;
  }

  .choice .num {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: color-mix(in srgb, var(--paper-line) 75%, transparent);
  }

  .choice:active { transform: translateY(1px); }
  .choice:disabled { cursor: default; }

  .choice[aria-pressed="true"] {
    border-color: var(--accent);
    box-shadow: 0 2px 0 var(--accent);
  }

  .choice[aria-pressed="true"] .num {
    color: var(--accent-ink);
    background: var(--accent);
  }

  .choice.correct {
    border-color: var(--good);
    background: var(--good-bg);
    box-shadow: 0 2px 0 var(--good);
  }

  .choice.correct .num { color: #06281f; background: var(--good); }

  .choice.wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
    box-shadow: 0 2px 0 var(--bad);
  }

  .choice.wrong .num { color: #2c0f0c; background: var(--bad); }

  .choice.dim { opacity: 0.45; }

  .reader-bar {
    display: flex;
    flex-direction: column;
    gap: 11px;
    background: color-mix(in srgb, var(--paper-alt) 55%, transparent);
    border: 1.5px solid var(--paper-line);
    border-radius: 12px;
    padding: 12px 13px;
    margin: 0 0 16px;
  }

  .reader-modes { display: flex; gap: 6px; }

  .reader-mode {
    flex: 1;

    border-radius: 8px;
    padding: 9px 13px;

  </div>

  <div class="level-row">
  <div class="tabs" id="tabsGroup" role="tablist" aria-label="Niveau"></div>
    <span class="expert-toggle">
      <span id="expertLabel">Mode expert</span>
      <button class="switch" id="expertBtn" type="button" role="switch" aria-checked="false" aria-labelledby="expertLabel"><span class="knob"></span></button>
    </span>
  </div>

  <div class="dots" id="dots"></div>

  <div id="problemZone">

    </div>

    <div id="readingZone" hidden>

  function storageKey(level) {
    return 'calcul-mental-best-' + (state.expert ? 'expert-' : '') + level;
  }

  function loadBest(level) {
    try {
      var v = localStorage.getItem(storageKey(level));
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }

  function saveBest(level, correct) {
    try {
      var prev = loadBest(level);
      if (!prev || correct > prev) {
        localStorage.setItem(storageKey(level), JSON.stringify(correct));
      }
    } catch (e) {}
  }

  function nextSheetNumber() {
    try {
      var n = parseInt(localStorage.getItem('calcul-mental-sheet-number') || '0', 10) + 1;
      localStorage.setItem('calcul-mental-sheet-number', String(n));
      return n;
    } catch (e) { return 1; }
  }

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = randInt(0, i);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildWordItems(bank, expert, total) {
    var count = expert ? 6 : 4;
    return shuffle(bank).slice(0, total).map(function (entry) {
      var others = bank.filter(function (w) { return w.word !== entry.word; });
      var sameLetter = others.filter(function (w) {
        return w.word.charAt(0).toLowerCase() === entry.word.charAt(0).toLowerCase();
      });
      var ranked = shuffle(sameLetter).concat(shuffle(others));
      var picked = [];
      for (var i = 0; i < ranked.length && picked.length < count - 1; i++) {
        if (picked.indexOf(ranked[i].word) === -1) picked.push(ranked[i].word);
      }
      return {
        picture: entry.emoji,
        story: '',
        questionHtml: '',
        choices: shuffle(picked.concat([entry.word])),
        answer: entry.word
      };
    });
  }

  function buildSentenceItems(bank, expert, total) {
    return shuffle(bank).slice(0, total).map(function (entry) {
      var choices = entry.options.slice();
      if (expert) {
        var others = shuffle(bank.filter(function (o) { return o !== entry; }));
        for (var i = 0; i < others.length && choices.length < 4; i++) {
          var cand = others[i].options[randInt(0, others[i].options.length - 1)];
          if (choices.indexOf(cand) === -1) choices.push(cand);
        }
      }
      return {
        picture: '',
        story: '',
        questionHtml: escapeHtml(entry.text).replace('___', '<span class="gap"></span>'),
        choices: shuffle(choices),
        answer: entry.answer
      };
    });
  }

  function buildStoryItems(bank, expert, total) {
    var all = [];
    bank.forEach(function (story) {
      story.qs.forEach(function (q) { all.push({ story: story, q: q }); });
    });
    return shuffle(all).slice(0, total).map(function (it) {
      var choices = [it.q.answer].concat(it.q.wrong);
      if (expert) {
        var extra = [];
        it.story.qs.forEach(function (q) {
          if (q !== it.q) extra = extra.concat(q.wrong, [q.answer]);
        });
        extra = shuffle(extra);
        for (var i = 0; i < extra.length && choices.length < 4; i++) {
          if (choices.indexOf(extra[i]) === -1) choices.push(extra[i]);
        }
      }
      return {
        picture: '',
        story: it.story.text,
        questionHtml: escapeHtml(it.q.q),
        choices: shuffle(choices),
        answer: it.q.answer
      };
    });
  }

  // Round-robin over the passages so every one is seen before any repeats.
  function buildTextItems(bank, expert, total) {
    var shuffled = shuffle(bank).map(function (p) { return { p: p, qs: shuffle(p.qs) }; });
    var picked = [];
    for (var round = 0; picked.length < total && round < 8; round++) {
      for (var i = 0; i < shuffled.length && picked.length < total; i++) {
        if (round < shuffled[i].qs.length) picked.push({ p: shuffled[i].p, q: shuffled[i].qs[round] });
      }
    }
    return picked.map(function (it) {
      var choices = [it.q.answer].concat(it.q.wrong);
      if (expert) {
        var extra = [];
        it.p.qs.forEach(function (q) { if (q !== it.q) extra = extra.concat(q.wrong, [q.answer]); });
        extra = shuffle(extra);
        for (var i = 0; i < extra.length && choices.length < 4; i++) {
          if (choices.indexOf(extra[i]) === -1) choices.push(extra[i]);
        }
      }
      return {
        picture: '',
        story: it.p.text,
        words: it.p.text.split(/\s+/),
        questionHtml: escapeHtml(it.q.q),
        choices: shuffle(choices),
        answer: it.q.answer
      };
    });
  }

  function buildPool() {
    if (state.subject !== 'reading') { state.pool = []; return; }
    var bank = READING[state.lang] || READING.fr;
    if (state.level === 'word') state.pool = buildWordItems(bank.words, state.expert, state.total);
    else if (state.level === 'sentence') state.pool = buildSentenceItems(bank.sentences, state.expert, state.total);
    else if (state.level === 'text') state.pool = buildTextItems(bank.texts, state.expert, state.total);
    else state.pool = buildStoryItems(bank.stories, state.expert, state.total);
  }

  function makeProblem(level, expert) {
    var op = Math.random() < 0.5 ? '+' : '−';
    var a, b, t, ua;

    if (level === 'ten') {
      var cap = expert ? 20 : 10;
      if (op === '+') {
        a = randInt(1, cap - 1);
        b = randInt(1, cap - a);
      } else {
        a = randInt(1, cap);
        b = randInt(0, a);
      }
    } else if (level === 'twenty') {
      if (expert) {
        if (op === '+') {
          a = randInt(10, 40);
          b = randInt(2, Math.min(20, 50 - a));
        } else {
          a = randInt(20, 50);
          b = randInt(2, Math.min(19, a));
        }
      } else {
        var tens = randInt(0, 1) * 10;
        if (op === '+') {
          ua = randInt(0, 8);
          a = tens + ua;
          b = randInt(0, 9 - ua);
        } else {
          ua = randInt(0, 9);
          a = tens + ua;
          b = randInt(0, ua);
        }
      }
    } else {
      if (expert) {
        if (op === '+') {
          t = randInt(2, 8);
          ua = randInt(2, 9);
          a = t * 10 + ua;
          b = randInt(11 - ua, 9);
        } else {
          t = randInt(2, 9);
          ua = randInt(0, 8);
          a = t * 10 + ua;
          b = randInt(ua + 1, 9);
        }
      } else {
        if (op === '+') {
          a = randInt(2, 9);
          b = randInt(Math.min(Math.max(2, 11 - a), 9), 9);
        } else {
          a = randInt(11, 18);
          ua = a % 10;
          b = randInt(ua + 1, 9);
        }
      }
    }

    var result = op === '+' ? a + b : a - b;
    var missing = 'result';
    if (expert && Math.random() < 0.35) {
      missing = Math.random() < 0.5 ? 'b' : 'a';
    }
    var answer = missing === 'result' ? result : (missing === 'b' ? b : a);
    return { a: a, b: b, op: op, result: result, answer: answer, missing: missing };
  }

  function renderDots() {

  function buildKeypad() {

  function renderAnswer() {

  function onDigit(d) {
    if (state.locked || state.subject !== 'math') return;

  function onBackspace() {

  function setKeypadDisabled(disabled) {

  function buildChoices(choices) {
    var longest = 0;
    choices.forEach(function (c) { longest = Math.max(longest, c.length); });
    els.choices.innerHTML = '';
    els.choices.className = 'choices' + ((longest > 13 || choices.length % 2 === 1) ? ' stack' : '');
    els.choices.setAttribute('aria-label', L().choicesAria);
    choices.forEach(function (text, i) {

  function selectChoice(i) {
    if (state.locked || els.choices.hidden) return;

    state.choiceIndex = i;

  var reader = { timer: null, words: [], spans: [], i: 0, playing: false, done: false };

  function wordDelay(word) {
    var base = 60000 / state.readSpeed;
    var letters = word.replace(/[^0-9A-Za-zÀ-ÿ'’-]/g, '').length;
    var d = base * (0.7 + Math.min(letters, 12) / 18);
    if (/[.!?…]["»)]?$/.test(word)) d += base * 0.9;
    else if (/[,;:]["»)]?$/.test(word)) d += base * 0.45;
    return d;
  }

  function stopReader() {
    clearTimeout(reader.timer);
    reader.timer = null;
    reader.playing = false;
  }

  function renderPassage(words) {
    els.readStory.innerHTML = '';
    reader.spans = words.map(function (word, i) {
      if (i) els.readStory.appendChild(document.createTextNode(' '));
      var span = document.createElement('span');
      span.className = 'w';
      span.textContent = word;
      els.readStory.appendChild(span);
      return span;
    });
  }

  function highlightWord(i) {
    reader.spans.forEach(function (span, idx) {
      if (idx === i) span.classList.add('now');
      else span.classList.remove('now');
    });
    if (state.readerMode === 'word') {
      els.bigWord.textContent = i >= 0 ? (reader.words[i] || '') : '';
      els.bigWord.className = '';
    }
  }

  function renderReaderLabels() {
    var L_ = L();
    els.readerModeBtns[0].textContent = L_.readerAlong;
    els.readerModeBtns[1].textContent = L_.readerWord;
    els.readerModes.setAttribute('aria-label', L_.readerAria);
    els.speedLabel.textContent = L_.speedLabel;
    els.speedUnit.textContent = L_.speedUnit;
    els.speedValue.textContent = state.readSpeed;
    els.readSpeed.setAttribute('aria-label', L_.speedAria);
    els.pauseBtn.textContent = L_.pauseBtn;
    els.skipBtn.textContent = L_.skipBtn;
    els.playBtn.textContent = reader.done ? L_.replayBtn : (reader.i > 0 ? L_.resumeBtn : L_.playBtn);
    els.readerModeBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-reader') === state.readerMode ? 'true' : 'false');
    });
  }

  function setupReader(item) {
    stopReader();
    reader.words = item.words;
    reader.i = 0;
    reader.done = false;
    renderPassage(item.words);
    var wordMode = state.readerMode === 'word';
    els.readStory.classList.add('passage');
    els.readStory.hidden = wordMode;
    els.wordStage.hidden = !wordMode;
    els.bigWord.textContent = item.words[0] || '';
    els.bigWord.className = 'dim';
    els.readerBar.hidden = false;
    els.readQuestion.hidden = true;
    els.choices.hidden = true;
    els.playBtn.hidden = false;
    els.pauseBtn.hidden = true;
    els.skipBtn.hidden = false;
    renderReaderLabels();
  }

  function readerStep() {
    if (!reader.playing) return;
    if (reader.i >= reader.words.length) { finishReading(); return; }
    highlightWord(reader.i);
    var word = reader.words[reader.i];
    reader.timer = setTimeout(function () {
      reader.i++;
      readerStep();
    }, wordDelay(word));
  }

  function playReading() {
    if (reader.done || reader.i >= reader.words.length) { reader.i = 0; reader.done = false; }
    var wordMode = state.readerMode === 'word';
    els.wordStage.hidden = !wordMode;
    els.readStory.hidden = wordMode;
    reader.playing = true;
    els.playBtn.hidden = true;
    els.pauseBtn.hidden = false;
    els.skipBtn.hidden = false;
    readerStep();
  }

  function pauseReading() {
    stopReader();
    els.playBtn.hidden = false;
    els.pauseBtn.hidden = true;
    renderReaderLabels();
  }

  function finishReading() {
    stopReader();
    reader.done = true;
    highlightWord(-1);
    els.wordStage.hidden = true;
    els.readStory.hidden = false;
    els.readQuestion.hidden = false;
    els.choices.hidden = false;
    els.playBtn.hidden = false;
    els.pauseBtn.hidden = true;
    els.skipBtn.hidden = true;
    renderReaderLabels();
    if (!state.locked) {
      els.checkBtn.hidden = false;
      els.checkBtn.disabled = state.choiceIndex < 0;
    }
  }

  function setReaderMode(mode) {
    state.readerMode = mode;
    try { localStorage.setItem('calcul-mental-reader-mode', mode); } catch (e) {}
    renderReaderLabels();
    if (state.subject !== 'reading' || state.level !== 'text' || !reader.words.length) return;
    if (reader.done) {
      els.wordStage.hidden = true;
      els.readStory.hidden = false;
      return;
    }
    stopReader();
    reader.i = 0;
    highlightWord(-1);
    var wordMode = mode === 'word';
    els.wordStage.hidden = !wordMode;
    els.readStory.hidden = wordMode;
    els.bigWord.textContent = reader.words[0] || '';
    els.bigWord.className = 'dim';
    els.playBtn.hidden = false;

  function getAudioCtx() {
    if (!window.__sfxCtx) {
      window.__sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    var ctx = window.__sfxCtx;
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function playClick() {
    try {
      var ctx = getAudioCtx();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(1100, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(CLICK_PEAK, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.06);
    } catch (e) {}
  }

  function playCorrect() {
    try {
      var ctx = getAudioCtx();
      var t0 = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach(function (freq, i) {
        var start = t0 + i * 0.09;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.24);
      });
    } catch (e) {}
  }

  function playIncorrect() {
    try {
      var ctx = getAudioCtx();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(320, t0);
      osc.frequency.exponentialRampToValueAtTime(140, t0 + 0.28);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.34);
    } catch (e) {}
  }

  function playMeow() {
    try {
      var ctx = getAudioCtx();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(500, t0);
      osc.frequency.exponentialRampToValueAtTime(850, t0 + 0.09);
      osc.frequency.exponentialRampToValueAtTime(320, t0 + 0.32);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.36);
    } catch (e) {}
  }

  var CHORDS = [
    { bass: 130.81, tones: [261.63, 329.63, 392.00] },
    { bass: 98.00, tones: [246.94, 293.66, 392.00] },
    { bass: 110.00, tones: [220.00, 261.63, 329.63] },
    { bass: 87.31, tones: [220.00, 261.63, 349.23] }
  ];
  var ARP = [0, 1, 2, 1, 0, 1, 2, 1];
  var STEP_DUR = 60 / 96 / 2;

  var MUSIC_PEAK = 0.3;

  var music = { on: false, gain: null, timer: null, nextTime: 0, step: 0, starting: false };

  function musicTargetGain() {
    return Math.max(0.0001, MUSIC_PEAK * (state.musicVolume / 100));
  }

  function musicPlaying() {
    return music.on && (music.timer !== null || music.starting);
  }

  function musicNote(ctx, freq, time, dur, type, vol) {
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g).connect(music.gain);
    osc.start(time);
    osc.stop(time + dur + 0.05);
  }

  function scheduleStep(ctx, step, time) {
    var chord = CHORDS[Math.floor(step / 8) % CHORDS.length];
    musicNote(ctx, chord.tones[ARP[step % 8]], time, 0.42, 'triangle', 0.5);
    if (step % 4 === 0) {
      musicNote(ctx, chord.bass, time, 0.7, 'sine', 0.75);
    }
  }

  function beginScheduler() {
    music.starting = false;
    if (!music.on || music.timer) return;
    var ctx;
    try { ctx = getAudioCtx(); } catch (e) { return; }
    if (ctx.state !== 'running') return;
    if (!music.gain) {
      music.gain = ctx.createGain();
      music.gain.gain.value = 0.0001;
      music.gain.connect(ctx.destination);
    }
    music.gain.gain.cancelScheduledValues(ctx.currentTime);
    music.gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    music.gain.gain.linearRampToValueAtTime(musicTargetGain(), ctx.currentTime + 0.8);
    music.nextTime = ctx.currentTime + 0.1;
    music.step = 0;
    music.timer = setInterval(function () {
      if (ctx.state !== 'running') return;
      if (music.nextTime < ctx.currentTime) music.nextTime = ctx.currentTime + 0.05;
      while (music.nextTime < ctx.currentTime + 0.15) {
        scheduleStep(ctx, music.step, music.nextTime);
        music.nextTime += STEP_DUR;
        music.step = (music.step + 1) % (CHORDS.length * 8);
      }
    }, 25);
  }

  function stopScheduler() {
    clearInterval(music.timer);
    music.timer = null;
    if (!music.gain) return;
    try {
      var ctx = getAudioCtx();
      music.gain.gain.cancelScheduledValues(ctx.currentTime);
      music.gain.gain.setValueAtTime(music.gain.gain.value, ctx.currentTime);
      music.gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    } catch (e) {}
  }

  function setMusic(on) {
    music.on = on;
    els.musicBtn.setAttribute('aria-checked', on ? 'true' : 'false');
    try { localStorage.setItem('calcul-mental-music', on ? 'on' : 'off'); } catch (e) {}
    if (on) {
      music.starting = true;
      try { getAudioCtx().resume().then(beginScheduler).catch(function () { music.starting = false; }); }
      catch (e) { music.starting = false; }
    } else {
      music.starting = false;
      stopScheduler();
    }
  }

  // Browsers suspend the audio context until a gesture, and again whenever the
  // tab is backgrounded or the phone is locked. Pick the music back up instead
  // of leaving the switch on and silent.
  function resumeIfNeeded() {
    if (!music.on) return;
    try {
      var ctx = getAudioCtx();
      if (ctx.state !== 'running') ctx.resume().catch(function () {});
    } catch (e) {}
    if (music.timer || music.starting) return;
    music.starting = true;
    try { getAudioCtx().resume().then(beginScheduler).catch(function () { music.starting = false; }); }
    catch (e) { music.starting = false; }
  }

  function healAudio(e) {
    if (e && e.target && els.musicBtn.contains(e.target)) return;
    resumeIfNeeded();
  }

  function restoreMusicPref() {
    var saved = null;
    try { saved = localStorage.getItem('calcul-mental-music'); } catch (e) {}
    if (saved !== 'on') return;
    music.on = true;
    els.musicBtn.setAttribute('aria-checked', 'true');
  }

  function playFireworkPop() {
    try {
      var ctx = getAudioCtx();
      var t0 = ctx.currentTime;
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, t0);
      osc.frequency.exponentialRampToValueAtTime(1200, t0 + 0.18);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.06, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.22);

      var len = Math.floor(ctx.sampleRate * 0.5);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 800;
      var ng = ctx.createGain();
      ng.gain.setValueAtTime(0.16, t0 + 0.2);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
      src.connect(filter).connect(ng).connect(ctx.destination);
      src.start(t0 + 0.2);
    } catch (e) {}
  }

  function spawnFireworks() {
    var colors = ['#F2B134', '#4ECDA0', '#7CC6FE', '#FF8FB1', '#FFE6A3', '#FF6B6B'];
    var bursts = 6;
    var overlay = document.createElement('div');
    overlay.className = 'firework-overlay';
    document.body.appendChild(overlay);
    for (var b = 0; b < bursts; b++) {
      (function (index) {
        setTimeout(function () {
          var cx = randInt(15, 85);
          var cy = randInt(12, 60);
          var color = colors[randInt(0, colors.length - 1)];
          for (var i = 0; i < 16; i++) {
            var angle = (Math.PI * 2 * i) / 16;
            var dist = randInt(60, 115);
            var particle = document.createElement('div');
            particle.className = 'firework-particle';
            particle.style.left = cx + 'vw';
            particle.style.top = cy + 'vh';
            particle.style.background = color;
            particle.style.setProperty('--dx', (Math.cos(angle) * dist).toFixed(1) + 'px');
            particle.style.setProperty('--dy', (Math.sin(angle) * dist).toFixed(1) + 'px');
            particle.style.animationDelay = (Math.random() * 0.05).toFixed(3) + 's';
            overlay.appendChild(particle);
          }
          playFireworkPop();
        }, index * 380);
      })(b);
    }
    setTimeout(function () { overlay.remove(); }, bursts * 380 + 1600);
  }

  function maybeShowCat() {
    if (randInt(1, 100) !== 1) return;
    els.catPop.hidden = false;
    playMeow();
    setTimeout(function () { els.catPop.hidden = true; }, 2200);
  }

  function renderMathProblem() {
    state.current = makeProblem(state.level, state.expert);
    var p = state.current;
    var blank = '<span id="answerDisplay" class="placeholder">?</span>';
    var opSpan = '<span class="eq">' + p.op + '</span>';
    var eqSpan = '<span class="eq">=</span>';
    if (p.missing === 'a') {
      els.equation.innerHTML = blank + opSpan + '<span>' + p.b + '</span>' + eqSpan + '<span>' + p.result + '</span>';
    } else if (p.missing === 'b') {
      els.equation.innerHTML = '<span>' + p.a + '</span>' + opSpan + blank + eqSpan + '<span>' + p.result + '</span>';
    } else {
      els.equation.innerHTML = '<span>' + p.a + '</span>' + opSpan + '<span>' + p.b + '</span>' + eqSpan + blank;
    }
    setKeypadDisabled(false);
    renderAnswer();
  }

  function renderReadingProblem() {
    stopReader();
    if (!state.pool.length) buildPool();
    state.current = state.pool[state.index % state.pool.length];
    var item = state.current;
    els.readPrompt.textContent = L().readPrompts[state.level];
    els.readPicture.textContent = item.picture || '';
    els.readPicture.hidden = !item.picture;
    els.readQuestion.innerHTML = item.questionHtml || '';
    buildChoices(item.choices);
    els.checkBtn.disabled = true;
    if (item.words) {
      setupReader(item);
    } else {
      els.readerBar.hidden = true;
      els.wordStage.hidden = true;
      els.readStory.classList.remove('passage');
      els.readStory.textContent = item.story || '';
      els.readStory.hidden = !item.story;
      els.readQuestion.hidden = !item.questionHtml;
      els.choices.hidden = false;
    }
  }

  function newProblem() {
    state.answer = '';
    state.choiceIndex = -1;
    state.locked = false;
    if (state.subject === 'reading') renderReadingProblem();
    else renderMathProblem();
    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
    els.checkBtn.hidden = state.subject === 'reading' && state.level === 'text';
    els.nextBtn.hidden = true;
    renderDots();
    maybeShowCat();
  }

  function checkAnswer() {
    if (state.locked) return;
    var correct;
    if (state.subject === 'reading') {
      if (state.choiceIndex < 0) return;
      correct = state.current.choices[state.choiceIndex] === state.current.answer;
      state.locked = true;
      revealChoices();
    } else {
      if (state.answer.length === 0) return;
      correct = parseInt(state.answer, 10) === state.current.answer;
      state.locked = true;
      setKeypadDisabled(true);
    }
    state.results[state.index] = correct;
    els.checkBtn.disabled = true;

    if (correct) {
      state.correctCount++;
      state.streak++;
      var goodMessages = L().goodMessages;
      var msg = goodMessages[randInt(0, goodMessages.length - 1)];
      if (state.streak > 0 && state.streak % 3 === 0) {
        msg += L().comboSuffix(state.streak);
      }
      els.feedback.textContent = msg;
      els.feedback.className = 'feedback good';
      popText(L().popYeah, 'good');
      playCorrect();
      spawnConfetti();
    } else {
      state.streak = 0;
      els.feedback.textContent = L().incorrectMsg(state.current.answer);
      els.feedback.className = 'feedback bad';
      popText(L().popOoh, 'bad');
      playIncorrect();
      setTimeout(spawnSlime, 850);
    }

    renderGradeBox();
    renderDots();
    renderStreak();
    els.checkBtn.hidden = true;
    els.nextBtn.hidden = false;
    els.nextBtn.focus();
  }

  function openCelebration(n) {
    var L_ = L();
    els.celebrateCount.textContent = L_.celebrateCount;
    els.celebrateTitle.textContent = L_.celebrateTitle(n);
    els.celebrateBody.textContent = L_.celebrateMessages[randInt(0, L_.celebrateMessages.length - 1)];
    els.celebrateBtn.textContent = L_.celebrateBtn;
    els.celebrateModal.hidden = false;
    els.celebrateBtn.focus();
    spawnFireworks();
  }

  function closeCelebration() {
    els.celebrateModal.hidden = true;
  }

  function advance() {
    var streakHit = state.results[state.index] === true &&
      state.streak > 0 && state.streak % STREAK_CELEBRATE === 0;
    state.index++;
    if (state.index >= state.total) {
      showResults();
    } else {
      newProblem();
    }
    if (streakHit) openCelebration(state.streak);
  }

  function showResults() {
    stopReader();
    els.problemZone.hidden = true;
    els.resultsZone.hidden = false;
    var pct = Math.round((state.correctCount / state.total) * 100);
    var low = pct < 60;
    els.resultsInner.parentElement.className = low ? 'results low' : 'results';
    var bonus = pct >= 70 ? L().resultsBonus : '';
    var levelName = L().levelLabels[state.level];
    els.resultsInner.innerHTML =
      '<div class="grade">' + pct + '%</div>' +
      '<p>' + L().resultsText(state.correctCount, state.total, levelName, bonus) + '</p>';
    saveBest(state.level, state.correctCount);
    renderBest();
    if (pct >= 90) spawnFireworks();
  }

  function startSheet(level) {
    state.level = level;
    state.total = state.expert ? QUESTIONS.expert : QUESTIONS.normal;
    state.index = 0;
    state.correctCount = 0;
    state.streak = 0;
    state.results = [];
    state.sheetNumber = nextSheetNumber();
    els.problemZone.hidden = false;
    els.resultsZone.hidden = true;
    stopReader();
    buildPool();
    applyTabs();
    renderSheetLabel();
    renderStreak();
    renderGradeBox();
    renderBest();
    newProblem();
  }

  function applyTabs() {
    els.tabsGroup.innerHTML = '';
    LEVELS[state.subject].forEach(function (lvl) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'tab';
      tab.setAttribute('role', 'tab');
      tab.setAttribute('data-level', lvl);
      tab.textContent = L().levelLabels[lvl];
      if (lvl === 'carry') tab.setAttribute('aria-label', L().levelAriaCarry);
      tab.setAttribute('aria-pressed', lvl === state.level ? 'true' : 'false');
      tab.addEventListener('click', function () { playClick(); startSheet(lvl); });
      els.tabsGroup.appendChild(tab);
    });
  }

  function applySubject() {
    var reading = state.subject === 'reading';
    els.mathZone.hidden = reading;
    els.readingZone.hidden = !reading;
    els.titleText.textContent = reading ? L().readTitle : L().title;
    els.taglineText.textContent = reading ? L().readTagline : L().tagline;
    els.subjectBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-subject') === state.subject ? 'true' : 'false');
    });
  }

  function applyLanguage(lang) {
    state.lang = lang;
    try { localStorage.setItem('calcul-mental-lang', lang); } catch (e) {}
    var L_ = LANG[lang];
    document.documentElement.lang = lang;
    els.sheetEl.lang = lang;
    els.tabsGroup.setAttribute('aria-label', L_.levelGroupAria);
    els.subjectSwitch.setAttribute('aria-label', L_.subjectGroupAria);
    els.subjectBtns.forEach(function (b) {
      b.querySelector('.txt').textContent = L_.subjects[b.getAttribute('data-subject')];
    });
    applySubject();
    applyTabs();
    els.readPrompt.textContent = L_.readPrompts[state.level] || '';
    els.choices.setAttribute('aria-label', L_.choicesAria);
    els.celebrateBtn.textContent = L_.celebrateBtn;
    els.celebrateCount.textContent = L_.celebrateCount;
    renderReaderLabels();
    els.keypad.setAttribute('aria-label', L_.keypadAria);
    var bsBtn = els.keypad.querySelector('[data-key="backspace"]');
    if (bsBtn) bsBtn.setAttribute('aria-label', L_.backspaceAria);
    var vBtn = els.keypad.querySelector('[data-key="validate"]');
    if (vBtn) vBtn.setAttribute('aria-label', L_.validateAria);
    els.checkBtn.textContent = L_.validateBtn;
    els.nextBtn.textContent = L_.nextBtn;
    els.newSheetBtn.textContent = L_.newSheetBtn;
    els.resetBtn.textContent = L_.resetBtn;
    els.expertLabel.textContent = L_.expertLabel;
    els.signInBtn.textContent = L_.signInBtn;
    els.signUpBtn.textContent = L_.signUpBtn;
    els.musicLabel.textContent = L_.musicLabel;
    els.musicVolume.setAttribute('aria-label', L_.volumeLabel);
    els.resetTitle.textContent = L_.modalTitle;
    els.resetBody.textContent = L_.modalBody;
    els.resetCancel.textContent = L_.modalCancel;
    els.resetConfirm.textContent = L_.modalConfirm;
    els.catBubbleText.textContent = L_.catBubble;
    els.langBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    renderSheetLabel();
    renderStreak();
    renderBest();
  }

  function openResetModal() {
    playClick();
    els.resetModal.hidden = false;
    els.resetConfirm.focus();
  }

  function closeResetModal() {
    els.resetModal.hidden = true;
    els.resetBtn.focus();
  }

  function doReset() {
    try {
      LEVELS.math.concat(LEVELS.reading).forEach(function (lvl) {
        localStorage.removeItem('calcul-mental-best-' + lvl);
        localStorage.removeItem('calcul-mental-best-expert-' + lvl);
      });
      localStorage.removeItem('calcul-mental-sheet-number');
    } catch (e) {}
    closeResetModal();
    renderBest();
  }

  els.langBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playClick();
      var lang = btn.getAttribute('data-lang');
      if (lang === state.lang) return;
      applyLanguage(lang);
      if (state.subject === 'reading' && els.resultsZone.hidden) {
        buildPool();
        if (!state.locked) newProblem();
      }
    });
  });

  els.subjectBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playClick();
      var subject = btn.getAttribute('data-subject');
      if (subject === state.subject) return;
      state.subject = subject;
      try { localStorage.setItem('calcul-mental-subject', subject); } catch (e) {}
      applySubject();
      startSheet(LEVELS[subject][0]);
    });
  });

  els.expertBtn.addEventListener('click', function () {
    playClick();
    state.expert = !state.expert;
    els.expertBtn.setAttribute('aria-checked', state.expert ? 'true' : 'false');
    try { localStorage.setItem('calcul-mental-expert', state.expert ? 'on' : 'off'); } catch (e) {}
    startSheet(state.level);
  });

  els.musicBtn.addEventListener('click', function () {
    playClick();
    setMusic(!musicPlaying());
  });

  document.addEventListener('pointerdown', healAudio, true);
  document.addEventListener('keydown', healAudio, true);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) resumeIfNeeded();
  });
  window.addEventListener('pageshow', resumeIfNeeded);
  window.addEventListener('focus', resumeIfNeeded);

  els.musicVolume.addEventListener('input', function () {
    state.musicVolume = parseInt(els.musicVolume.value, 10) || 0;
    try { localStorage.setItem('calcul-mental-music-volume', String(state.musicVolume)); } catch (e) {}
    if (!music.gain) return;
    try {
      var ctx = getAudioCtx();
      music.gain.gain.cancelScheduledValues(ctx.currentTime);
      music.gain.gain.setValueAtTime(music.on ? musicTargetGain() : 0.0001, ctx.currentTime);
    } catch (e) {}
  });

  els.resetBtn.addEventListener('click', openResetModal);
  els.resetCancel.addEventListener('click', function () { playClick(); closeResetModal(); });
  els.resetConfirm.addEventListener('click', function () { playClick(); doReset(); });
  els.resetModal.addEventListener('click', function (e) {
    if (e.target === els.resetModal) closeResetModal();
  });

  els.readerModeBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      playClick();
      setReaderMode(btn.getAttribute('data-reader'));
    });
  });

  els.playBtn.addEventListener('click', function () { playClick(); playReading(); });
  els.pauseBtn.addEventListener('click', function () { playClick(); pauseReading(); });
  els.skipBtn.addEventListener('click', function () { playClick(); finishReading(); });

  els.readSpeed.addEventListener('input', function () {
    state.readSpeed = parseInt(els.readSpeed.value, 10) || READ_SPEED_DEFAULT;
    try { localStorage.setItem('calcul-mental-reader-speed', String(state.readSpeed)); } catch (e) {}
    els.speedValue.textContent = state.readSpeed;
  });

  els.celebrateBtn.addEventListener('click', function () { playClick(); closeCelebration(); });
  els.celebrateModal.addEventListener('click', function (e) {
    if (e.target === els.celebrateModal) closeCelebration();
  });

  els.checkBtn.addEventListener('click', checkAnswer);
  els.nextBtn.addEventListener('click', function () { playClick(); advance(); });
  els.newSheetBtn.addEventListener('click', function () { playClick(); startSheet(state.level); });


  document.addEventListener('keydown', function (e) {
    if (!els.resetModal.hidden) {
      if (e.key === 'Escape') closeResetModal();
      return;
    }
    if (!els.celebrateModal.hidden) {
      if (e.key === 'Escape' || e.key === 'Enter') closeCelebration();
      return;
    }
    if (els.resultsZone.hidden === false) return;
    if (state.subject === 'reading') {
      if (!state.locked && e.key >= '1' && e.key <= '6') {
        selectChoice(parseInt(e.key, 10) - 1);
      } else if (e.key === 'Enter') {
        if (state.locked) advance();
        else checkAnswer();
      }
      return;
    }
    if (!state.locked && e.key >= '0' && e.key <= '9') {
      onDigit(e.key);
    } else if (!state.locked && e.key === 'Backspace') {
      onBackspace();
    } else if (e.key === 'Enter') {
      if (state.locked) advance();
      else checkAnswer();
    }
  });

  var clerkStarted = false;
  var userButtonMounted = false;

  function renderAuth() {
    var clerk = window.Clerk;
    var signedIn = !!clerk.user;
    els.signInBtn.hidden = signedIn;
    els.signUpBtn.hidden = signedIn;
    els.userButton.hidden = !signedIn;
    if (signedIn && !userButtonMounted) {
      clerk.mountUserButton(els.userButton);
      userButtonMounted = true;
    } else if (!signedIn && userButtonMounted) {
      clerk.unmountUserButton(els.userButton);
      userButtonMounted = false;
    }
    els.authBox.hidden = false;
  }

  function initAuth() {
    var clerk = window.Clerk;
    if (!clerk || clerkStarted) return;
    clerkStarted = true;
    clerk.load({
      ui: { ClerkUI: window.__internal_ClerkUICtor },
      appearance: {
        variables: {
          colorPrimary: '#F2B134',
          colorPrimaryForeground: '#3A2508',
          colorBackground: '#0f2b52',
          colorForeground: '#F4F7FC',
          colorMutedForeground: '#9FB6DE',
          colorBorder: '#1f4d8c',
          colorInput: '#163a6c',
          colorInputForeground: '#F4F7FC',
          colorDanger: '#F0685B',
          colorSuccess: '#4ECDA0',
          fontFamily: "'Public Sans', -apple-system, 'Segoe UI', sans-serif",
          borderRadius: '10px'
        }
      }
    }).then(function () {
      renderAuth();
      clerk.addListener(renderAuth);
    })['catch'](function (err) {
      // Signing in is optional: the app stays fully playable if Clerk never loads.
      if (window.console) console.warn('Clerk failed to load', err);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAuth);
  } else {
    initAuth();
  }

  els.signInBtn.addEventListener('click', function () {
    playClick();
    if (window.Clerk) window.Clerk.openSignIn();
  });

  els.signUpBtn.addEventListener('click', function () {
    playClick();
    if (window.Clerk) window.Clerk.openSignUp();
  });

  buildKeypad();
  els.expertBtn.setAttribute('aria-checked', state.expert ? 'true' : 'false');
  state.level = LEVELS[state.subject][0];
  applyLanguage(state.lang);
  startSheet(state.level);
  els.musicVolume.value = state.musicVolume;
  els.readSpeed.value = state.readSpeed;
  els.speedValue.textContent = state.readSpeed;
  restoreMusicPref();
})();
</script>
</body>
